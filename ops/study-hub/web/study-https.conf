# Production: exclusive Study Hub hostname, no apex/www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name study.gatssby.com.br;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/study.gatssby.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.gatssby.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /srv/study-hub-web/current;
    index index.html;
    autoindex off;
    auth_basic "Study Hub private";
    auth_basic_user_file /etc/nginx/study-hub-web.htpasswd;
    satisfy all;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control "private, no-store" always;
    location = /api/dashboard {
        if ($request_method != GET) { return 405; }
        if ($args != "") { return 400; }
        proxy_pass http://127.0.0.1:3401/api/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering on;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
    }
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ /index.html;
    }
}
