[project]
name = "study-hub"
version = "0.1.0"
description = "Independent Anki vNext and Federal Online study infrastructure"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/anki-gpt/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
