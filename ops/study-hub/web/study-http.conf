# Dedicated Study Hub hostname only. ACME is the sole public HTTP content.
server {
    listen 80;
    listen [::]:80;
    server_name study.gatssby.com.br;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/study-hub-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://study.gatssby.com.br$request_uri; }
}
